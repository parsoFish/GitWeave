---
name: Validate Overlay Configs

'on':
  pull_request:
    paths:
      - config/**

permissions:
  contents: read

jobs:
  overlay-validate:
    name: Validate Overlay Configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate overlay configs
        run: python3 scripts/validate_overlay_configs.py config/repos/
