---
name: GitWeave Apply

'on':
  push:
    branches: ["main"]
    paths:
      - "config/**"
  pull_request:
    paths:
      - "config/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (show changes without applying)"
        type: boolean
        default: false
      target_env:
        description: "Target environment name (e.g. staging, prod, feature/*). Leave empty to use base variables only."
        type: string
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  apply-staging:
    name: Apply Overlays (staging)
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install copier pyyaml

      - name: Post Overlay Dry-run Diff as PR Comment
        if: github.event_name == 'pull_request'
        run: |
          python scripts/dry-run-overlays.py \
            --pr-number ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --config-dir config/repos/ \
            --modules-dir modules/

      - name: Apply Staging Overlays (dry-run on PR)
        if: github.event_name == 'pull_request' || inputs.dry_run == true
        run: |
          python scripts/apply-overlays.py --dry-run --env staging --config-dir config/repos/

      - name: Apply Staging Overlays
        if: github.event_name == 'push' && inputs.dry_run != true
        run: |
          python scripts/apply-overlays.py --env staging --config-dir config/repos/

  apply-production:
    name: Apply Overlays (production)
    runs-on: ubuntu-latest
    needs: [apply-staging]
    environment: production

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install copier pyyaml

      - name: Apply Production Overlays (dry-run on PR)
        if: github.event_name == 'pull_request' || inputs.dry_run == true
        run: |
          python scripts/apply-overlays.py --dry-run --env production --config-dir config/repos/

      - name: Apply Production Overlays
        if: github.event_name == 'push' && inputs.dry_run != true
        run: |
          python scripts/apply-overlays.py --env production --config-dir config/repos/

  notify:
    name: Failure Notification and Incident Management
    runs-on: ubuntu-latest
    needs: [apply-staging, apply-production]
    if: always()
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Open incident issue on failure
        if: failure()
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[Incident] GitWeave Apply failed on ${{ github.ref_name }}" \
            --label "incident,workflow-failure" \
            --body "Workflow: ${{ github.workflow }} | Commit: ${{ github.sha }} | Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Close open incident issues on success
        if: success()
        run: |
          gh issue list \
            --repo "${{ github.repository }}" \
            --label "incident,workflow-failure" \
            --search "GitWeave Apply" \
            --state open \
            --json number \
            --jq ".[].number" | \
          xargs -r -I{} gh issue close {} \
            --repo "${{ github.repository }}" \
            --comment "Resolved: GitWeave Apply succeeded on ${{ github.ref_name }}"
