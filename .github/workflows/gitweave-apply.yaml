---
name: GitWeave Apply

'on':
  push:
    branches: ["main"]
    paths:
      - "config/**"
  pull_request:
    paths:
      - "config/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (show changes without applying)"
        type: boolean
        default: false

jobs:
  apply:
    name: Apply Configuration
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install copier pyyaml

      - name: Apply Overlays (dry-run on PR)
        if: github.event_name == 'pull_request' || inputs.dry_run == true
        run: |
          python scripts/apply-overlays.py --dry-run --config-dir config/repos/

      - name: Apply Overlays
        if: github.event_name == 'push' && inputs.dry_run != true
        run: |
          python scripts/apply-overlays.py --config-dir config/repos/
