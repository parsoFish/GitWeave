---
name: GitWeave Apply

'on':
  push:
    branches: ["main"]
    paths:
      - "config/**"
      - "gitweave/**"
      - ".github/workflows/gitweave-apply.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "config/**"
      - "gitweave/**"
      - ".github/workflows/gitweave-apply.yaml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dry-run-smoke:
    name: Apply Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gw
        run: pip install -e .

      - name: Plan (fixture mode — no credentials)
        run: gw plan --fixture tests/fixtures/org-empty.json

  plan:
    name: gw plan (credential-free)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gw
        run: pip install -e .
      - name: Plan (fixture mode — no credentials)
        run: gw plan --fixture tests/fixtures/org-empty.json

  apply:
    name: gw apply (live)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gw
        run: pip install -e .
      - name: Write private key to temp file
        run: |
          KEY_FILE=$(mktemp)
          echo "$GW_APP_PRIVATE_KEY" > "$KEY_FILE"
          echo "GW_APP_PRIVATE_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"
          echo "KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
        env:
          GW_APP_PRIVATE_KEY: ${{ secrets.GW_APP_PRIVATE_KEY }}
      - name: Apply
        run: gw apply
        env:
          GW_ORG: ${{ secrets.GW_ORG }}
          GW_APP_ID: ${{ secrets.GW_APP_ID }}
          GW_APP_INSTALLATION_ID: ${{ secrets.GW_APP_INSTALLATION_ID }}
          GW_RESOURCE_PREFIX: ${{ vars.GW_RESOURCE_PREFIX }}
      - name: Cleanup key file
        if: always()
        run: rm -f "$KEY_FILE"
