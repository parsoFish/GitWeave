---
name: CI

'on':
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  structural-tests:
    name: Structural Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pyyaml yamllint jsonschema

      - name: Run structural tests
        run: pytest tests/test_structure.py tests/test_overlay_schema.py

      - name: Validate copier.yaml schema
        run: pytest tests/test_copier_schema.py tests/test_copier_schema_ci.py

      - name: Lint workflow YAML files
        run: yamllint .github/workflows/

  dry-run-smoke:
    name: Dry-Run Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]" pyyaml

      - name: Run gw plan dry-run and assert overlay output
        run: |
          set -euo pipefail
          OUTPUT=$(python3 -m gitweave.cli plan \
            --fixture tests/fixtures/overlay-smoke.json)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -E "would add \[python_service|unchanged"
