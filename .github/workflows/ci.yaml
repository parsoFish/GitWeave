---
name: CI

'on':
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  structural-tests:
    name: Structural Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pyyaml yamllint

      - name: Run structural tests
        run: pytest tests/test_structure.py

      - name: Lint workflow YAML files
        run: yamllint .github/workflows/
