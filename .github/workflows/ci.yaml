---
name: CI

'on':
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  structural-tests:
    name: Structural Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pyyaml yamllint

      - name: Run structural tests
        run: pytest tests/test_structure.py

      - name: Lint workflow YAML files
        run: yamllint .github/workflows/

      - name: Check workflow permissions
        run: python scripts/check_workflow_permissions.py .github/workflows/
