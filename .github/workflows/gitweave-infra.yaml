---
name: GitWeave Infrastructure

'on':
  pull_request:
    branches: ["main"]
    paths:
      - "infra/**"
  push:
    branches: ["main"]
    paths:
      - "infra/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        continue-on-error: true
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan
          TF_EXIT_CODE=$?
          echo "TF_EXIT_CODE=${TF_EXIT_CODE}" >> "${GITHUB_ENV}"
          exit ${TF_EXIT_CODE}

      - name: Show Terraform Plan Output
        if: always()
        run: |
          if [ -f tfplan ]; then
            terraform show -no-color tfplan > plan_output.txt
          else
            echo "Plan generation failed." > plan_output.txt
          fi

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/tfplan

      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Skip comment when no changes (TF_EXIT_CODE=0 means no diff)
          if [ "${TF_EXIT_CODE}" = "0" ]; then
            echo "No changes detected (TF_EXIT_CODE=0), skipping PR comment."
            exit 0
          fi

          # Read plan output and truncate at 65000 chars with notice
          PLAN_OUTPUT=$(cat plan_output.txt 2>/dev/null \
              || echo "No plan output available.")
          if [ ${#PLAN_OUTPUT} -gt 65000 ]; then
            PLAN_OUTPUT="${PLAN_OUTPUT:0:65000}"$'\n...\n[Output truncated]'
          fi

          # Build comment body; gitweave-tf-plan marker enables dedup
          RUN_BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          RUN_URL="${RUN_BASE}/actions/runs/${GITHUB_RUN_ID}"
          COMMENT_BODY=$(cat <<BODY
          <!-- gitweave-tf-plan -->
          <details><summary>Terraform Plan (exit ${TF_EXIT_CODE})</summary>

          ${PLAN_OUTPUT}

          </details>

          **Run:** ${RUN_URL}
          **Commit:** ${GITHUB_SHA}
          BODY
          )

          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Search for existing gitweave-tf-plan comment by unique marker
          ISSUES_BASE="repos/${GITHUB_REPOSITORY}/issues"
          COMMENTS_PATH="${ISSUES_BASE}/${PR_NUMBER}/comments"
          JQ_SELECT='.[] | select(.body | contains("gitweave-tf-plan")) | .id'
          COMMENT_ID=$(gh api "${COMMENTS_PATH}" \
            --jq "${JQ_SELECT}" | head -1)

          if [ -n "${COMMENT_ID}" ]; then
            # Update existing comment via PATCH to avoid duplicating comments
            COMMENTS_BASE="repos/${GITHUB_REPOSITORY}/issues/comments"
            PATCH_PATH="${COMMENTS_BASE}/${COMMENT_ID}"
            gh api --method PATCH "${PATCH_PATH}" \
              --field body="${COMMENT_BODY}"
          else
            # Create new comment via POST when none exists yet
            gh api "${COMMENTS_PATH}" \
              --field body="${COMMENT_BODY}"
          fi

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [plan]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
