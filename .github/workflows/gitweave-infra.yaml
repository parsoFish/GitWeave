---
name: GitWeave Infrastructure

'on':
  pull_request:
    branches: ["main"]
    paths:
      - "infra/**"
  push:
    branches: ["main"]
    paths:
      - "infra/**"

permissions:
  contents: read
  issues: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.5.0
        with:
          name: terraform-plan
          path: infra/tfplan

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [plan]
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: terraform-plan
          path: infra

      - name: Terraform Apply
        run: terraform apply -input=false tfplan

      - name: Open incident issue on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[Incident] GitWeave Infrastructure failed on ${{ github.ref_name }}" \
            --label "incident,workflow-failure" \
            --body "Workflow: ${{ github.workflow }} | Commit: ${{ github.sha }} | Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Close open incident issues on success
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list \
            --repo "${{ github.repository }}" \
            --label "incident,workflow-failure" \
            --search "GitWeave Infrastructure" \
            --state open \
            --json number \
            --jq ".[].number" | \
          xargs -r -I{} gh issue close {} \
            --repo "${{ github.repository }}" \
            --comment "Resolved: GitWeave Infrastructure succeeded on ${{ github.ref_name }}"
