# gitweave self-serve policy
# One entry per team slug; each entry declares what that team is allowed to request.
teams:
  - slug: platform
    allowed_request_types:
      - new-repo
      - content-update
      - team-membership
      - policy-exception
    allowed_repo_patterns:
      - "*"
    allowed_exceptions:
      - skip-codeowners
      - skip-branch-protection
      - skip-required-reviews
    allowed_content_settings:
      - branch_protection
      - repo_variables
      - environments
      - topics
      - description

  - slug: test-restricted
    allowed_request_types:
      - new-repo
    allowed_repo_patterns:
      - "restricted-only-*"

  - slug: dave-parso
    allowed_request_types:
      - new-repo
      - content-update
      - team-membership
    allowed_repo_patterns:
      - "forge-*"
      - "gw-*"
    allowed_content_settings:
      - branch_protection
      - repo_variables
      - environments
      - topics
      - description
