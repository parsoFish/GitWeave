# GitWeave Repository Overlay — smoke-test fixture
#
# This file is used by the CI dry-run smoke test job.
# It exercises the full apply-overlays.py pipeline without touching any external repo.

apiVersion: gitweave.io/v1
kind: RepositoryOverlay

metadata:
  name: example-smoke-repo

spec:
  # Target repository in owner/repo format.
  repository: my-org/example-smoke-repo

  # Template modules to apply.
  modules:
    - name: python_service
